version: '3.8'

services:
  # Serviço NordVPN
  nordvpn:
    image: ghcr.io/bubuntux/nordvpn:latest
    container_name: nordvpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.rp_filter=2
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/net/tun
    environment:
      - TOKEN=${NORDVPN_TOKEN}
      - CONNECT=United_States
      - TECHNOLOGY=NordLynx
      - NETWORK=192.168.0.0/16,172.16.0.0/12
      - TZ=America/Sao_Paulo
      - DEBUG=on
    networks:
      - vpn_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "https://api.ipify.org"]
      interval: 30s
      timeout: 10s
      retries: 3

  # App de busca de passagens
  flight_monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight_monitor
    network_mode: "service:nordvpn"
    depends_on:
      nordvpn:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      - NORDVPN_TOKEN=${NORDVPN_TOKEN}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # Nginx para acesso externo
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8777:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vpn_network
    depends_on:
      - nordvpn
      - flight_monitor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
